name: Auto Deploy Portfolio

on:
  push:
    branches:
      - Apps-addition
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build   # CRA output directory

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages      # ✅ REQUIRED FIX

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
